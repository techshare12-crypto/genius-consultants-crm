# ==============================================================================
# RENDER BLUEPRINT SPECIFICATION: GENIUS CONSULTANTS OPERATIONS PORTAL
# ==============================================================================
# This configuration deploys:
# 1. Managed PostgreSQL Database (genius-consultants-db)
# 2. Node.js Express REST API & WebSocket Server (genius-consultants-api)
# 3. React Vite Single Page Application Static Site (genius-consultants-client)
# ==============================================================================

databases:
  - name: genius-consultants-db
    databaseName: genius_crm
    user: genius_admin
    plan: free
    region: singapore

services:
  # ----------------------------------------------------
  # 1. BACKEND REST API & WEBSOCKET SERVICE
  # ----------------------------------------------------
  - type: web
    name: genius-consultants-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm run prisma:push && npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: genius-consultants-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: https://genius-consultants-client.onrender.com
      - key: CORS_ORIGIN
        value: https://genius-consultants-client.onrender.com
      - key: SOCKET_CORS_ORIGIN
        value: https://genius-consultants-client.onrender.com
      - key: STORAGE_PROVIDER
        value: LOCAL
      - key: LOCAL_UPLOAD_DIR
        value: ./uploads/documents

  # ----------------------------------------------------
  # 2. FRONTEND STATIC APPLICATION (SPA)
  # ----------------------------------------------------
  - type: web
    name: genius-consultants-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://genius-consultants-api.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://genius-consultants-api.onrender.com
      - key: VITE_PUBLIC_URL
        value: https://genius-consultants-client.onrender.com
      - key: VITE_SHOW_DEMO_LOGINS
        value: "false"
